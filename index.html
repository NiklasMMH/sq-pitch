<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Dein Weg · salesqueens</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{--bg:#F9F7F5;--rose:#C0597B;--rose2:#D27997;--roseL:#F7E6EC;--ink:#2A2522;--muted:#7C706A;--serif:'Instrument Serif',Georgia,serif;--sans:'DM Sans',system-ui,sans-serif;--cam:cubic-bezier(.65,0,.25,1);--spring:cubic-bezier(.34,1.35,.5,1)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);overflow:hidden;font-family:var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}
#vp{position:fixed;inset:0;overflow:hidden}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:50% 50%;overflow:hidden;background:radial-gradient(1200px 700px at 85% 30%,rgba(210,121,151,.10),transparent 60%),radial-gradient(900px 600px at 10% 40%,rgba(130,140,160,.10),transparent 60%),var(--bg)}
.brand{position:absolute;left:120px;top:64px;font-family:var(--serif);font-style:italic;font-size:38px;color:var(--rose);z-index:20}

/* camera */
#world{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;will-change:transform}
.abyss{position:absolute;left:440px;top:600px;width:1040px;height:480px;background:linear-gradient(180deg,rgba(42,37,34,0),rgba(42,37,34,.07))}
.cliff{position:absolute;top:600px;width:760px;height:480px;background:linear-gradient(180deg,#FFFFFF 0,#F3ECE6 18px,#E9DFD8 100%);box-shadow:0 -1px 0 #fff inset,0 30px 60px -30px rgba(42,37,34,.25);-webkit-mask-image:linear-gradient(180deg,#000 40%,transparent);mask-image:linear-gradient(180deg,#000 40%,transparent)}
#cL{left:-320px;border-radius:0 44px 0 0}
#cR{left:1480px;border-radius:44px 0 0 0}
#cold{position:absolute;left:-200px;top:200px;width:900px;height:700px;background:radial-gradient(closest-side,rgba(120,132,155,.22),transparent);transition:opacity 1.2s}
#sun{position:absolute;left:1340px;top:80px;width:700px;height:700px;background:radial-gradient(closest-side,rgba(232,170,120,.35),rgba(210,121,151,.18) 50%,transparent);transition:opacity 1.2s,transform 1.4s var(--cam);opacity:.6}
#world.arrived #sun{opacity:1;transform:scale(1.25)}
#world.away #cold{opacity:.25}

/* pain sign */
#pain{position:absolute;left:50px;top:360px;width:250px;height:240px;display:flex;flex-direction:column;align-items:center;transition:opacity .8s,filter .8s}
#pain .card{width:100%;padding:16px 18px;border-radius:18px;background:#EEF0F3;border:1px solid #DFE3E8;box-shadow:0 18px 40px -22px rgba(42,37,34,.35)}
#pain .post{flex:1;width:8px;background:linear-gradient(#C9CDD3,#B7BCC3);border-radius:4px}
.lbl{font-size:12px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:#8A93A0}
#pain p{font-family:var(--serif);font-size:27px;line-height:1.08;color:#4A5160;margin-top:6px;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
#world.away #pain{opacity:0}

/* rain */
#cloud{position:absolute;left:330px;top:350px;width:120px;height:46px;transition:opacity .8s}
#cloud i{position:absolute;border-radius:50%;background:#A9AFB8}
#cloud i:nth-child(1){left:0;top:16px;width:58px;height:30px}
#cloud i:nth-child(2){left:26px;top:0;width:56px;height:46px}
#cloud i:nth-child(3){left:60px;top:12px;width:60px;height:34px}
#cloud b{position:absolute;top:44px;width:3px;height:12px;border-radius:2px;background:#9AA6B6;animation:rain 1s linear infinite;opacity:0}
#cloud b:nth-of-type(1){left:22px}#cloud b:nth-of-type(2){left:46px;animation-delay:.3s}#cloud b:nth-of-type(3){left:70px;animation-delay:.6s}#cloud b:nth-of-type(4){left:94px;animation-delay:.15s}
@keyframes rain{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(62px);opacity:0}}
#world.away #cloud{opacity:0}

/* goal */
#goal{position:absolute;left:1520px;top:226px;width:330px;padding:22px 26px;border-radius:26px;background:rgba(255,255,255,.85);border:1px solid #fff;box-shadow:0 30px 70px -30px rgba(192,89,123,.55);transition:opacity .8s,filter .8s,transform 1s var(--spring),box-shadow 1s}
#goal .lbl{color:var(--rose)}
#gAmt{font-family:var(--serif);font-size:66px;line-height:1;color:var(--rose);margin-top:6px;letter-spacing:-1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#gUnit{font-size:16px;color:var(--muted);margin-top:2px}
#gWish{font-family:var(--serif);font-style:italic;font-size:26px;line-height:1.1;color:var(--ink);margin-top:12px;padding-top:12px;border-top:1px solid #F0E3E8}
#world.dimg #goal{opacity:.18;filter:blur(2px)}
#world.arrived #goal{transform:translateY(-8px) scale(1.04);box-shadow:0 0 0 3px rgba(192,89,123,.35),0 40px 90px -30px rgba(192,89,123,.8)}
.flag{position:absolute;left:1868px;top:470px;width:5px;height:130px;border-radius:3px;background:var(--ink)}
.flag i{position:absolute;left:5px;top:4px;width:58px;height:38px;background:linear-gradient(135deg,var(--rose),var(--rose2));clip-path:polygon(0 0,100% 50%,0 100%);transform-origin:left;animation:wave 2.4s ease-in-out infinite}
@keyframes wave{50%{transform:scaleX(.82) skewY(4deg)}}

/* pillars */
.pil{position:absolute;top:600px;width:140px;height:480px;margin-left:-70px}
.pil .gh{position:absolute;left:0;right:0;top:0;height:300px;border:2px dashed rgba(192,89,123,.45);border-bottom:0;border-radius:14px 14px 0 0;opacity:0;transition:opacity .6s;-webkit-mask-image:linear-gradient(#000 30%,transparent);mask-image:linear-gradient(#000 30%,transparent);display:flex;justify-content:center;padding-top:60px;font-family:var(--serif);font-size:64px;color:var(--rose)}
#world.ghost .pil:not(.up) .gh{opacity:1}
.pil .col{position:absolute;inset:0;transform:scaleY(0);transform-origin:50% 100%;transition:transform 1.1s var(--spring);-webkit-mask-image:linear-gradient(180deg,#000 50%,transparent);mask-image:linear-gradient(180deg,#000 50%,transparent)}
.pil.up .col{transform:none}
.cap{position:absolute;left:-14px;right:-14px;top:0;height:26px;border-radius:8px;background:linear-gradient(180deg,#FFFFFF,#EADFD7);box-shadow:0 10px 18px -8px rgba(42,37,34,.35);z-index:1}
.sh{position:absolute;left:9px;right:9px;top:22px;bottom:0;background:repeating-linear-gradient(90deg,transparent 0 15px,rgba(255,255,255,.3) 15px 17px,rgba(0,0,0,.05) 17px 19px),linear-gradient(90deg,#B04D6F,#DA8CA7 45%,#B7557A)}
.num{position:absolute;left:50%;top:70px;width:56px;height:56px;margin-left:-28px;border-radius:50%;background:#fff;color:var(--rose);display:grid;place-items:center;font-family:var(--serif);font-style:italic;font-size:34px;box-shadow:0 6px 16px -6px rgba(42,37,34,.35)}
.pil.f .col{filter:drop-shadow(0 0 30px rgba(192,89,123,.55))}

/* chips */
.chips{position:absolute;top:352px;transform:translateX(-50%);display:flex;gap:12px;z-index:6;white-space:nowrap}
.chips span{display:flex;align-items:center;gap:9px;height:48px;padding:0 20px;border-radius:99px;background:rgba(255,255,255,.92);border:1px solid #fff;box-shadow:0 14px 30px -16px rgba(42,37,34,.4);font-size:19px;font-weight:600;color:var(--ink);opacity:0;transform:translateY(14px) scale(.9);transition:opacity .45s,transform .6s var(--spring)}
.chips span::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--rose)}
.chips.on span{opacity:1;transform:none}
.chips.on span:nth-child(2){transition-delay:.15s}.chips.on span:nth-child(3){transition-delay:.3s}

/* objection */
#obj{position:absolute;left:960px;top:300px;transform:translateX(-50%) scale(.8);opacity:0;transition:opacity .5s,transform .7s var(--spring);z-index:7}
#obj.on{opacity:1;transform:translateX(-50%) scale(1)}
#obj .bb{position:relative;padding:16px 26px;border-radius:30px;background:#fff;box-shadow:0 20px 50px -24px rgba(42,37,34,.45);font-family:var(--serif);font-size:30px;white-space:nowrap;min-width:330px;height:66px;text-align:center}
#obj .bb span{position:absolute;inset:0;display:grid;place-items:center;transition:opacity .5s,transform .6s var(--spring)}
#obj .a{color:var(--muted)} #obj .b{color:var(--rose);font-style:italic;opacity:0;transform:translateY(10px)}
#obj.sw .a{opacity:0;transform:translateY(-10px)} #obj.sw .b{opacity:1;transform:none}
#obj i{position:absolute;border-radius:50%;background:#fff;box-shadow:0 6px 14px -6px rgba(42,37,34,.35)}
#obj i:nth-of-type(1){left:50%;top:76px;width:18px;height:18px;margin-left:-14px}
#obj i:nth-of-type(2){left:50%;top:100px;width:10px;height:10px;margin-left:-6px}

/* deck */
#deck{position:absolute;left:440px;top:586px;width:1040px;height:16px;border-radius:5px;background:linear-gradient(180deg,#fff,#E8DED6);box-shadow:0 10px 16px -10px rgba(42,37,34,.35);transform:scaleX(0);transform-origin:left;transition:transform 1s var(--cam)}
#deck::after{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:linear-gradient(90deg,var(--rose),var(--rose2))}
#world.deck #deck{transform:none}

/* avatar */
#me{position:absolute;left:-28px;top:488px;width:56px;height:112px;z-index:8;transform-origin:50% 100%}
#me .hd{position:absolute;left:10px;top:0;width:36px;height:36px;border-radius:50%;background:#F0C8B4}
#me .hr{position:absolute;left:6px;top:-4px;width:44px;height:30px;border-radius:24px 24px 6px 6px;background:#4A3530}
#me .hr::after{content:"";position:absolute;right:-4px;top:12px;width:14px;height:40px;border-radius:8px;background:#4A3530}
#me .bd{position:absolute;left:4px;top:40px;width:48px;height:56px;border-radius:24px 24px 10px 10px;background:linear-gradient(180deg,var(--rose2),var(--rose))}
#me .lg{position:absolute;top:92px;width:12px;height:20px;border-radius:0 0 6px 6px;background:var(--ink)}
#me .l1{left:14px}#me .l2{left:30px}
#me .tag{position:absolute;left:50%;top:-44px;transform:translateX(-50%);white-space:nowrap;padding:5px 13px;border-radius:99px;background:var(--ink);color:#fff;font-size:14px;font-weight:600;letter-spacing:.04em}
#world.arrived #me .tag{background:var(--rose)}
#world.away:not(.arrived) #me .bd{background:linear-gradient(180deg,var(--rose2),var(--rose))}
#world:not(.away) #me .bd{background:linear-gradient(180deg,#B9B3BF,#8F8A99)}

/* confetti */
#conf{position:absolute;left:1600px;top:520px;width:0;height:0;z-index:9}
#conf s{position:absolute;width:10px;height:14px;border-radius:2px;opacity:0}
#world.arrived #conf s{animation:boom 1.6s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes boom{0%{opacity:1;transform:translate(0,0) rotate(0)}100%{opacity:0;transform:translate(var(--x),var(--y)) rotate(var(--r))}}

/* HUD */
#hud{position:absolute;left:120px;top:50%;width:620px;transform:translateY(-50%);z-index:20;transition:opacity .45s,transform .6s var(--spring)}
#hud.wide{top:130px;transform:none;width:1300px}
#hud.out{opacity:0}
#hud .k{font-size:15px;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:var(--rose);min-height:18px}
#hud h1{font-family:var(--serif);font-weight:400;font-size:100px;line-height:.98;letter-spacing:-2px;margin-top:14px}
#hud.wide h1{font-size:84px}
#hud p{font-size:30px;color:var(--muted);margin-top:18px;line-height:1.3}
#hud p:empty{display:none}
#hud h1 em{font-style:italic;color:var(--rose)}

#dots{position:absolute;left:50%;bottom:48px;transform:translateX(-50%);display:flex;gap:10px;z-index:20}
#dots i{width:8px;height:8px;border-radius:8px;background:#DCD0C8;transition:all .5s var(--spring)}
#dots i.on{width:30px;background:var(--rose)}
#edit{position:absolute;right:48px;bottom:36px;z-index:21;padding:8px 16px;border-radius:99px;border:1px solid #E6DCD5;background:rgba(255,255,255,.7);font:600 14px var(--sans);color:var(--muted);cursor:pointer;opacity:.0;transition:opacity .3s}
#stage:hover #edit{opacity:1}

/* setup */
#setup{position:absolute;inset:0;z-index:50;display:grid;place-items:center;background:rgba(249,247,245,.72);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);transition:opacity .5s}
#setup.hide{opacity:0;pointer-events:none}
#setup form{width:760px;padding:48px 54px;border-radius:34px;background:#fff;box-shadow:0 40px 100px -40px rgba(42,37,34,.4)}
#setup h2{font-family:var(--serif);font-weight:400;font-size:56px;letter-spacing:-1px}
#setup h2 em{color:var(--rose)}
#setup .s{font-size:18px;color:var(--muted);margin-top:4px}
#setup label{display:block;margin-top:24px;font-size:13px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
#setup input{display:block;width:100%;margin-top:8px;height:58px;padding:0 20px;border-radius:16px;border:1.5px solid #EAE1DB;background:#FBF9F7;font:500 22px var(--sans);color:var(--ink);outline:none;user-select:text;-webkit-user-select:text}
#setup input:focus{border-color:var(--rose);background:#fff;box-shadow:0 0 0 4px rgba(192,89,123,.12)}
#setup .row{display:grid;grid-template-columns:1fr 1fr;gap:18px}
#setup button{margin-top:32px;width:100%;height:64px;border:0;border-radius:99px;background:linear-gradient(135deg,var(--rose),var(--rose2));color:#fff;font:600 21px var(--sans);cursor:pointer;box-shadow:0 20px 40px -20px rgba(192,89,123,.8)}

/* portrait */
body.m #hud,body.m #hud.wide{left:72px;right:72px;width:auto;top:200px;transform:none}
body.m #hud h1{font-size:96px}
body.m #hud.wide h1{font-size:84px}
body.m #hud p{font-size:36px}
body.m .brand{left:72px;top:80px;font-size:48px}
body.m #dots{bottom:80px}
body.m #dots i{width:12px;height:12px}body.m #dots i.on{width:40px}
body.m #setup form{width:940px}
body.m #setup input{height:80px;font-size:32px}
body.m #setup label{font-size:20px}
body.m #setup h2{font-size:72px}
body.m #setup .s{font-size:26px}
body.m #setup button{height:90px;font-size:30px}
body.m #setup .row{grid-template-columns:1fr}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important;animation-duration:.01ms!important}}
</style>
</head>
<body>
<div id="vp"><div id="stage">
  <div id="world">
    <div id="cold"></div><div id="sun"></div>
    <div class="abyss"></div>
    <div class="cliff" id="cL"></div><div class="cliff" id="cR"></div>
    <div id="pain"><div class="card"><div class="lbl">Heute</div><p id="pTxt"></p></div><div class="post"></div></div>
    <div id="cloud"><i></i><i></i><i></i><b></b><b></b><b></b><b></b></div>
    <div id="goal"><div class="lbl">Dein Ziel</div><div id="gAmt"></div><div id="gUnit">im Monat</div><div id="gWish"></div></div>
    <div class="flag"><i></i></div>
    <div class="pil" id="P1" style="left:640px"><div class="gh">?</div><div class="col"><div class="cap"></div><div class="sh"></div><div class="num">1</div></div></div>
    <div class="pil" id="P2" style="left:960px"><div class="gh">?</div><div class="col"><div class="cap"></div><div class="sh"></div><div class="num">2</div></div></div>
    <div class="pil" id="P3" style="left:1280px"><div class="gh">?</div><div class="col"><div class="cap"></div><div class="sh"></div><div class="num">3</div></div></div>
    <div id="deck"></div>
    <div class="chips" id="C1" style="left:660px"><span>Psychologie</span><span>Mindset</span><span>High-Ticket</span></div>
    <div class="chips" id="C2" style="left:960px"><span>Fragen</span><span>Live-Calls</span><span>Freigabe</span></div>
    <div class="chips" id="C3" style="left:1230px"><span>Video</span><span>Interview</span><span>closerinnen.de</span></div>
    <div id="obj"><div class="bb"><span class="a">„Ich schlaf nochmal drüber …“</span><span class="b">„Was ist noch offen?“</span></div><i></i><i></i></div>
    <div id="me"><div class="tag" id="mTag"></div><div class="lg l1"></div><div class="lg l2"></div><div class="bd"></div><div class="hr"></div><div class="hd"></div></div>
    <div id="conf"></div>
  </div>
  <div class="brand">salesqueens</div>
  <div id="hud"><div class="k"></div><h1></h1><p></p></div>
  <div id="dots"></div>
  <button id="edit">✎ Daten</button>
  <div id="setup"><form id="f" autocomplete="off">
    <h2>Für wen ist <em>dieser Weg?</em></h2>
    <div class="s">Aus der Bedarfserhebung, ihre eigenen Worte.</div>
    <label>Name</label><input id="iN" placeholder="z. B. Lisa">
    <label>Wo steht sie heute?</label><input id="iP" placeholder="z. B. Jeden Monat aufs Konto schauen">
    <div class="row">
      <div><label>Finanzielles Ziel / Monat</label><input id="iG" placeholder="z. B. 3000" inputmode="numeric"></div>
      <div><label>Was ermöglicht ihr das?</label><input id="iW" placeholder="z. B. Zeit mit den Kindern"></div>
    </div>
    <button type="submit">Weg zeigen →</button>
  </form></div>
</div></div>

<script>
const $ = id => document.getElementById(id);
const world = $('world'), hud = $('hud'), me = $('me');
const N = 9;
const X = {start:360, p1:640, p2:960, p3:1280, goal:1600};
const posFor = s => s <= 3 ? 'start' : s === 4 ? 'p1' : s <= 6 ? 'p2' : s === 7 ? 'p3' : 'goal';
const CAM = ['wide', [235,460,1.9], [1680,410,1.8], 'wide', [640,450,1.75], [960,450,1.75], [960,420,2.05], [1260,450,1.75], [1420,430,1.3]];
let D = {n:'', p:'', g:'', w:''};
let step = 0, timers = [], ax = X.start, W = 1920, H = 1080, mob = false;
const T = (ms, fn) => timers.push(setTimeout(fn, ms));

function load() {
  const q = new URLSearchParams(location.search);
  try { D = Object.assign(D, JSON.parse(localStorage.getItem('sq-hj') || '{}')); } catch(e) {}
  ['n','p','g','w'].forEach(k => { if (q.get(k)) D[k] = q.get(k); });
}
const nm = () => (D.n || 'Lisa').trim();
function amt() {
  const g = (D.g || '3000').trim();
  if (/^[\d.\s]+(€|eur|euro)?$/i.test(g)) { const v = +g.replace(/[^\d]/g, ''); return v ? v.toLocaleString('de-DE') + ' €' : g; }
  return g;
}
const isNum = () => /€$/.test(amt());
function paint() {
  $('mTag').textContent = nm();
  $('pTxt').textContent = (D.p || 'Jeden Monat aufs Konto schauen').trim();
  $('gAmt').textContent = amt();
  $('gUnit').style.display = isNum() ? '' : 'none';
  $('gWish').textContent = (D.w || 'Mehr Zeit für das, was zählt').trim();
}
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function hudFor(s) {
  const n = esc(nm());
  return [
    ['Dein Weg', `${n}, <em>von hier nach da.</em>`, ''],
    ['Heute', 'Hier stehst <em>du.</em>', ''],
    ['Dein Ziel', 'Da willst <em>du hin.</em>', ''],
    ['', 'Was fehlt <em>dazwischen?</em>', ''],
    ['Schritt 1', 'Sales-<em>Fundament</em>', 'Kann ich das? Ja.'],
    ['Schritt 2', 'Verkaufs-<em>gespräch</em>', 'Fragen statt überreden.'],
    ['Einwand', 'Jetzt <em>klären.</em>', 'Nicht morgen.'],
    ['Schritt 3', 'Stelle <em>finden</em>', 'Vorbereitet bewerben.'],
    ['Angekommen', isNum() ? `Bringt dich das zu deinen <em>${esc(amt())}?</em>` : 'Bringt dich das zu <em>deinem Ziel?</em>', esc((D.w || '').trim())]
  ][s];
}
function showHud(s, delay) {
  hud.classList.add('out');
  T(delay, () => {
    const [k, h, p] = hudFor(s);
    hud.querySelector('.k').textContent = k; hud.querySelector('h1').innerHTML = h; hud.querySelector('p').innerHTML = p;
    hud.classList.toggle('wide', CAM[s] === 'wide');
    hud.classList.remove('out');
  });
}

function setCam(c, dur) {
  let x, y, s, a;
  const sk = mob ? .56 : 1;
  if (c === 'wide') { x = 950; y = 430; s = .97 * sk; a = [W / 2, mob ? H * .58 : 650]; }
  else { [x, y, s] = c; s *= mob ? .9 : 1; a = mob ? [W / 2, H * .58] : [W * .65, 560]; }
  world.style.transition = dur ? `transform ${dur}ms var(--cam)` : 'none';
  world.style.transform = `translate(${a[0] - x * s}px,${a[1] - y * s}px) scale(${s})`;
}
function place(x) { me.getAnimations().forEach(a => a.cancel()); ax = x; me.style.transform = `translateX(${x}px)`; }
function jump(x2, dur = 950, hgt = 170) {
  const x1 = ax, mid = (x1 + x2) / 2; ax = x2;
  me.animate([
    {transform:`translateX(${x1}px) scale(1,1)`},
    {offset:.14, transform:`translateX(${x1}px) translateY(6px) scale(1.14,.84)`},
    {offset:.55, transform:`translateX(${mid}px) translateY(${-hgt}px) scale(.94,1.08)`},
    {offset:.88, transform:`translateX(${x2}px) translateY(5px) scale(1.14,.86)`},
    {transform:`translateX(${x2}px) scale(1,1)`}
  ], {duration:dur, easing:'ease-in-out'});
  me.style.transform = `translateX(${x2}px)`;
}
function pillars(s) {
  [[1,4],[2,5],[3,7]].forEach(([i, from]) => $('P' + i).classList.toggle('up', s >= from));
  [[1,4],[2,5],[3,7]].forEach(([i]) => $('P' + i).classList.toggle('f', (i === 1 && s === 4) || (i === 2 && (s === 5 || s === 6)) || (i === 3 && s === 7)));
}
function chips(s) {
  [1,2,3].forEach(i => $('C' + i).classList.remove('on'));
  const i = s === 4 ? 1 : s === 5 ? 2 : s === 7 ? 3 : 0;
  return i ? $('C' + i) : null;
}
function confetti() {
  const c = $('conf'); c.innerHTML = '';
  const cols = ['#C0597B','#D27997','#E8AA78','#F3D1DC','#2A2522'];
  for (let i = 0; i < 34; i++) {
    const s = document.createElement('s'), a = Math.random() * Math.PI * 2, r = 120 + Math.random() * 220;
    s.style.background = cols[i % cols.length];
    s.style.setProperty('--x', Math.cos(a) * r + 'px'); s.style.setProperty('--y', (Math.sin(a) * r - 120) + 'px'); s.style.setProperty('--r', (Math.random() * 720 - 360) + 'deg');
    s.style.animationDelay = (Math.random() * .15) + 's';
    c.appendChild(s);
  }
}

function go(s, animate = true) {
  const prev = step;
  step = Math.max(0, Math.min(N - 1, s));
  timers.forEach(clearTimeout); timers = [];
  document.querySelectorAll('#dots i').forEach((d, i) => d.classList.toggle('on', i === step));
  const fwd = animate && step === prev + 1;
  world.classList.toggle('ghost', step === 3);
  world.classList.toggle('away', step >= 4);
  world.classList.toggle('dimg', [1,4,5,6,7].includes(step));
  world.classList.remove('arrived');
  world.classList.toggle('deck', step >= 8 && !fwd);
  $('obj').classList.remove('on', 'sw');
  const ch = chips(step);
  const target = X[posFor(step)];

  if (fwd && [4,5,7].includes(step)) {
    const midx = (ax + target) / 2;
    pillars(step - 1);
    setCam([midx, 470, 1.15], 950);
    hud.classList.add('out');
    T(400, () => pillars(step));
    T(1350, () => jump(target));
    T(2200, () => setCam(CAM[step], 1300));
    showHud(step, 2450);
    T(2900, () => ch && ch.classList.add('on'));
  } else if (fwd && step === 8) {
    pillars(step);
    setCam('wide', 1100);
    hud.classList.add('out');
    T(500, () => world.classList.add('deck'));
    T(1500, () => jump(target, 1150, 230));
    T(2650, () => { confetti(); world.classList.add('arrived'); });
    T(3300, () => setCam(CAM[8], 1400));
    showHud(step, 3600);
  } else {
    pillars(step);
    if (ax !== target) place(target);
    setCam(CAM[step], animate ? 1300 : 0);
    showHud(step, animate ? 500 : 0);
    if (ch) T(animate ? 1100 : 0, () => ch.classList.add('on'));
    if (step === 8) T(animate ? 900 : 0, () => { confetti(); world.classList.add('arrived'); });
  }
  if (step === 6) { T(500, () => $('obj').classList.add('on')); T(2200, () => $('obj').classList.add('sw')); }
}

function fit() {
  mob = innerWidth < innerHeight && innerWidth < 1000;
  document.body.classList.toggle('m', mob);
  W = mob ? 1080 : 1920; H = mob ? Math.max(1920, Math.round(1080 * innerHeight / innerWidth)) : 1080;
  const st = $('stage'); st.style.width = W + 'px'; st.style.height = H + 'px';
  const k = Math.min(innerWidth / W, innerHeight / H);
  st.style.transform = `translate(-50%,-50%) scale(${k})`;
  setCam(CAM[step], 0);
}

const setup = $('setup');
function openSetup() { ['n','p','g','w'].forEach(k => $('i' + k.toUpperCase()).value = D[k] || ''); setup.classList.remove('hide'); setTimeout(() => $('iN').focus(), 50); }
$('f').addEventListener('submit', e => {
  e.preventDefault();
  ['n','p','g','w'].forEach(k => D[k] = $('i' + k.toUpperCase()).value.trim());
  try { localStorage.setItem('sq-hj', JSON.stringify(D)); } catch(e) {}
  paint(); setup.classList.add('hide'); document.activeElement.blur();
  go(0, false); setTimeout(() => go(0), 30);
});
setup.addEventListener('click', e => e.stopPropagation());
$('edit').addEventListener('click', e => { e.stopPropagation(); openSetup(); });
const open = () => !setup.classList.contains('hide');

addEventListener('click', e => { if (open()) return; if (e.clientX < innerWidth * .15) go(step - 1); else go(step + 1); });
addEventListener('keydown', e => {
  if (open()) { if (e.key === 'Escape') setup.classList.add('hide'); return; }
  if (['ArrowRight',' ','PageDown','Enter'].includes(e.key)) { e.preventDefault(); go(step + 1); }
  else if (['ArrowLeft','PageUp','Backspace'].includes(e.key)) { e.preventDefault(); go(step - 1); }
  else if (e.key === 'f' || e.key === 'F') { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); }
  else if (e.key === 'r' || e.key === 'R') go(0);
  else if (e.key === 'e' || e.key === 'E') { e.preventDefault(); openSetup(); }
});

$('dots').innerHTML = '<i></i>'.repeat(N);
load(); paint(); place(X.start); addEventListener('resize', fit); fit();
const qs = new URLSearchParams(location.search).get('s');
if (qs !== null) { setup.classList.add('hide'); go(+qs, false); } else { go(0, false); openSetup(); }
</script>
</body>
